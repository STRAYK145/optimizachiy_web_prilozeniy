<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Без кэширования</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Open Graph -->
    <meta property="og:title" content="Без кэширования — Cache-Control: no-store" />
    <meta property="og:description" content="Ресурс, для которого запрещено хранение ответа в кэше (Cache-Control: no-store)." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="http://localhost:3000/no-cache.html" />
    <meta property="og:site_name" content="Оптимизация веб-приложений" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:image" content="http://localhost:3000/static/sticker.webp" />
    <meta property="og:image:type" content="image/webp" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Иллюстрация страницы" />
</head>

<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow-sm mx-auto" style="max-width: 600px;">
            <div class="card-body p-4">
                <h1 class="h3 mb-3">Без кэширования</h1>
                <div class="text-center my-4">
                    <img src="/static/sticker.webp" alt="Иллюстрация страницы" class="img-fluid rounded shadow-sm"
                        style="max-height: 300px; width: auto;">
                </div>
                <div class="alert alert-primary">
                    Cache-Control: no-store
                </div>
                <p class="text-secondary">
                    Для этого ресурса запрещено хранение ответа в кэше.
                </p>
                <a href="/" class="btn btn-outline-primary">
                    Вернуться на главную
                </a>
            </div>
        </div>
    </div>
</body>

</html>
